[package]
name = "achievement-hunter"
version = "0.1.0"
edition = "2024"
description = "Steam achievement hunting companion: library, guides, notes, flowgraphs"
license = "MIT"
repository = "https://github.com/Zsweezzy/achievement-hunter"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = 2
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
