[package]
name = "achievement-hunter"
version = "0.2.0"
edition = "2024"
description = "Steam achievement hunting companion: library, guides, notes, flowgraphs"
license = "MIT"
repository = "https://github.com/Zsweezzy/achievement-hunter"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
# eframe's own defaults pull `winit/default`; with default-features off we must
# re-enable it or Wayland fails at runtime (wayland-dlopen lives in winit).
winit = "0.30"
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
